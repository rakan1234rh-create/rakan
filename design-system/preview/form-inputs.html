<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--mr-text); padding: 22px 24px; box-sizing: border-box; }
  * { box-sizing: border-box; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; min-height: 40px;
    background: var(--mr-surface); color: var(--mr-primary);
    border: 1px solid var(--mr-primary-soft);
    border-radius: 999px;
    font-family: var(--font); font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--mr-primary); color: #fff; border-color: var(--mr-primary); box-shadow: 0 6px 16px rgba(15, 18, 36, 0.28); }
  .btn-success { background: var(--mr-success); color: #fff; border-color: var(--mr-success); }
  .btn-danger  { background: var(--mr-danger);  color: #fff; border-color: var(--mr-danger); }
  .btn-warning { background: var(--mr-warning); color: #2a2200; border-color: var(--mr-warning); }
  .btn-ghost   { background: transparent; border-color: transparent; color: var(--mr-text-2); }
  .btn-sm      { padding: 7px 14px; min-height: 32px; font-size: 12px; }
  
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { display:flex; flex-direction:column; gap: 6px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--mr-text-2); }
  .req { color: var(--mr-danger); margin-right: 4px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 11px 16px;
    background: var(--mr-surface); color: var(--mr-text);
    border: 1px solid var(--mr-border); border-radius: 14px;
    font-family: var(--font); font-size: 13px; outline: none;
  }
  .form-input:focus, .form-select:focus { border-color: var(--mr-primary); box-shadow: 0 0 0 4px var(--mr-primary-soft); }
  .form-input.error { border-color: var(--mr-danger); box-shadow: 0 0 0 4px rgba(239,68,68,0.12); }
  .help { font-size: 11px; color: var(--mr-text-3); }
  .help.err { color: var(--mr-danger); }

</style>
</head>
<body>
<div class="grid">
  <div class="field">
    <label class="form-label">الموظف المخالف <span class="req">*</span></label>
    <input class="form-input" placeholder="ابحث برقم الموظف أو الاسم...">
  </div>
  <div class="field">
    <label class="form-label">نوع المخالفة <span class="req">*</span></label>
    <select class="form-select"><option>تأخير عن الدوام</option></select>
  </div>
  <div class="field">
    <label class="form-label">تاريخ المخالفة</label>
    <input class="form-input" value="2026-04-12" style="border-color: var(--mr-primary); box-shadow: 0 0 0 4px var(--mr-primary-soft)">
    <div class="help">يلتزم بتقويم ميلادي</div>
  </div>
  <div class="field">
    <label class="form-label">الوقت</label>
    <input class="form-input error" value="—">
    <div class="help err">الوقت مطلوب</div>
  </div>
</div>
</body></html>
