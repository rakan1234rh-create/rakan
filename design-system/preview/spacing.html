<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--mr-text); padding: 20px; box-sizing: border-box; }
  * { box-sizing: border-box; }
  
  body { padding: 22px 20px; }
  .lbl { font-family: var(--mono); font-size: 10px; color: var(--mr-text-3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
  .scale { display:flex; align-items:flex-end; gap: 10px; margin-bottom: 16px; }
  .step { display:flex; flex-direction:column; align-items:center; gap: 6px; }
  .bar { background: var(--mr-primary); border-radius: 4px 4px 0 0; width: 22px; }
  .tag { font-family: var(--mono); font-size: 10px; color: var(--mr-text-3); }
  .stack { display:flex; flex-direction:column; gap: 0; }
  .pad { background: var(--mr-primary-soft); height: 14px; border-radius: 4px; }
  .rule { display:flex; justify-content:space-between; font-size: 11px; color: var(--mr-text-2); margin-top: 4px; }

</style>
</head>
<body>
<div class="lbl">Spacing scale (px)</div>
<div class="scale">
  <div class="step"><div class="bar" style="height:4px"></div><div class="tag">4</div></div>
  <div class="step"><div class="bar" style="height:8px"></div><div class="tag">8</div></div>
  <div class="step"><div class="bar" style="height:10px"></div><div class="tag">10</div></div>
  <div class="step"><div class="bar" style="height:12px"></div><div class="tag">12</div></div>
  <div class="step"><div class="bar" style="height:14px"></div><div class="tag">14</div></div>
  <div class="step"><div class="bar" style="height:16px"></div><div class="tag">16</div></div>
  <div class="step"><div class="bar" style="height:20px"></div><div class="tag">20</div></div>
  <div class="step"><div class="bar" style="height:24px"></div><div class="tag">24</div></div>
  <div class="step"><div class="bar" style="height:28px"></div><div class="tag">28</div></div>
  <div class="step"><div class="bar" style="height:32px"></div><div class="tag">32</div></div>
</div>
<div class="rule"><span>Page gutter <b style="color:var(--mr-text)">24</b></span><span>Card padding <b style="color:var(--mr-text)">22</b></span><span>Nav rhythm <b style="color:var(--mr-text)">6</b></span><span>Stat grid gap <b style="color:var(--mr-text)">12–22</b></span></div>
</body></html>
