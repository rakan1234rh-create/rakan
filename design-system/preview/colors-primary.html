<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--mr-text); padding: 20px; box-sizing: border-box; }
  * { box-sizing: border-box; }
  
  .row { display:flex; gap:14px; align-items:flex-start; }
  .sw { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .chip { height: 76px; border-radius: 14px; border:1px solid var(--mr-border); display:flex; align-items:flex-end; padding: 10px 12px; color: #fff; font-family: var(--mono); font-size: 11px; font-weight: 600; }
  .chip.light { color: var(--mr-text-2); }
  .meta { display:flex; justify-content:space-between; font-size: 11px; }
  .meta .name { color: var(--mr-text); font-weight: 600; }
  .meta .val { color: var(--mr-text-3); font-family: var(--mono); }

</style>
</head>
<body>
<div class="row">
  <div class="sw">
    <div class="chip" style="background:#0f1224">primary</div>
    <div class="meta"><span class="name">primary</span><span class="val">#0f1224</span></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#2a2d3f">hover</div>
    <div class="meta"><span class="name">primary-hover</span><span class="val">#2a2d3f</span></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#0f1224">text</div>
    <div class="meta"><span class="name">primary-text</span><span class="val">#0f1224</span></div>
  </div>
  <div class="sw">
    <div class="chip light" style="background:#e9e9ef">soft</div>
    <div class="meta"><span class="name">primary-soft</span><span class="val">#e9e9ef</span></div>
  </div>
  <div class="sw">
    <div class="chip light" style="background:#f3f3f6;border-color:#e4e6ef">softer</div>
    <div class="meta"><span class="name">primary-softer</span><span class="val">#f3f3f6</span></div>
  </div>
</div>
</body></html>
