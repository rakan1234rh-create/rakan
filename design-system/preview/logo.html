<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: var(--font);
    color: var(--mr-text);
    padding: 26px 32px;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }

  .lockup {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  /* Minimal mark: a thin square outline with an Arabic "م" inside */
  .mark {
    width: 52px; height: 52px;
    border: 1.5px solid var(--mr-primary);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: var(--mr-primary);
    font-family: var(--font);
    font-weight: 600;
    font-size: 28px;
    line-height: 1;
    position: relative;
    flex-shrink: 0;
  }
  .mark::after {
    content: "";
    position: absolute;
    bottom: 7px; right: 7px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--mr-success);
  }

  /* Wordmark — Arabic only */
  .word {
    display: flex;
    flex-direction: column;
    line-height: 1;
    gap: 6px;
  }
  .word__ar {
    font-family: var(--font);
    font-size: 32px;
    font-weight: 500;
    color: var(--mr-primary);
    letter-spacing: 0;
  }

  /* Tagline to the side */
  .tagline {
    margin-inline-start: auto;
    text-align: end;
    font-size: 12px;
    line-height: 1.5;
    color: var(--mr-text-2);
    max-width: 240px;
  }
  .tagline strong {
    display: block;
    color: var(--mr-text);
    font-weight: 600;
    margin-bottom: 2px;
  }
</style>
</head>
<body>
<div class="lockup">
  <div class="mark" aria-hidden="true"><span>م</span></div>
  <div class="word">
    <div class="word__ar">مرصاد</div>
  </div>
  <div class="tagline">
    <strong>منصة الرصد والامتثال</strong>
    تذاكر · مراجعة · إغلاق
  </div>
</div>
</body>
</html>
