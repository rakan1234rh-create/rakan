<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--mr-text); padding: 20px; box-sizing: border-box; }
  * { box-sizing: border-box; }
  
  .row { display:grid; grid-template-columns: 100px 1fr 110px; align-items: baseline; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--mr-border); }
  .row:last-child { border-bottom: none; }
  .tag { font-family: var(--mono); font-size: 10px; color: var(--mr-text-3); letter-spacing: 0.1em; text-transform: uppercase; }
  .meta { font-family: var(--mono); font-size: 10px; color: var(--mr-text-3); text-align: end; }

</style>
</head>
<body>
<div class="row" style="grid-template-columns: 100px 1fr 110px">
  <div class="tag">Display</div>
  <div style="font-size:32px;font-weight:700;letter-spacing:-0.02em;line-height:1.1">مرحباً بك، رنا</div>
  <div class="meta">32 / 700</div>
</div>
<div class="row">
  <div class="tag">H1</div>
  <div style="font-size:21px;font-weight:700">معالجة التذاكر</div>
  <div class="meta">21 / 700</div>
</div>
<div class="row">
  <div class="tag">H2</div>
  <div style="font-size:16px;font-weight:700">آخر المخالفات</div>
  <div class="meta">16 / 700</div>
</div>
<div class="row">
  <div class="tag">H3</div>
  <div style="font-size:15px;font-weight:700">رصد مخالفة جديدة</div>
  <div class="meta">15 / 700</div>
</div>
<div class="row">
  <div class="tag">Body</div>
  <div style="font-size:13px">سجّل مخالفة بأكبر قدر من التفاصيل وأرفق المستندات الداعمة.</div>
  <div class="meta">13 / 400</div>
</div>
<div class="row">
  <div class="tag">Meta</div>
  <div style="font-size:12px;color:var(--mr-text-3)">بانتظار رد الموظف · 3 أيام متبقية</div>
  <div class="meta">12 / 500</div>
</div>
<div class="row">
  <div class="tag">Kicker</div>
  <div style="font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:0.12em;color:var(--mr-text-3);text-transform:uppercase">MONITORING.SYSTEM</div>
  <div class="meta">10 / 600 mono</div>
</div>
</body></html>
