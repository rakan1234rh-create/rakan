<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--mr-bg); }
  body { font-family: var(--font); color: var(--mr-text); box-sizing: border-box; }
  * { box-sizing: border-box; }
  
  body { background: var(--mr-surface); padding: 22px; }
  .col { display:flex; flex-direction: column; gap: 12px; max-width: 340px; }
  .lbl { font-family: var(--mono); font-size: 10px; color: var(--mr-text-3); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; margin-bottom: -4px; }
  .nav-item { width: 100%; display:flex; align-items: center; gap: 10px; padding: 9px 11px; background: transparent; color: var(--mr-text-2); border: 2px solid transparent; border-radius: 12px; font-family: var(--font); font-size: 12px; font-weight: 600; text-align: right; position: relative; }
  .nav-item i { width: 34px; height: 34px; display:inline-flex; align-items:center; justify-content:center; border-radius: 10px; font-size: 14px; color: var(--mr-text-2); background: transparent; flex-shrink: 0; }
  .nav-item.hover { background: var(--mr-primary-softer); color: var(--mr-text); }
  .nav-item.hover i { color: var(--mr-primary); }
  .nav-item.active { color: var(--mr-text); }
  .nav-item.active i { background: var(--mr-primary); color: #fff; box-shadow: 0 6px 14px rgba(15, 18, 36, 0.28); }
  .nav-item.dim { opacity: 0.55; }
  .badge-pill { margin-right: auto; background: var(--mr-danger); color: #fff; font-size: 10px; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px; font-weight: 700; display:inline-flex; align-items:center; justify-content:center; font-family: var(--mono); }

</style>
</head>
<body>
<div class="col">
  <div class="lbl">Default</div>
  <button class="nav-item"><i class="fas fa-ticket"></i><span>معالجة التذاكر</span><span class="badge-pill num">7</span></button>
  <div class="lbl">Hover</div>
  <button class="nav-item hover"><i class="fas fa-ticket"></i><span>معالجة التذاكر</span><span class="badge-pill num">7</span></button>
  <div class="lbl">Active</div>
  <button class="nav-item active"><i class="fas fa-ticket"></i><span>معالجة التذاكر</span><span class="badge-pill num">7</span></button>
  <div class="lbl">Disabled</div>
  <button class="nav-item dim"><i class="fas fa-ticket"></i><span>معالجة التذاكر</span></button>
</div>
</body></html>
