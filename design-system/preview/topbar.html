<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--mr-bg); }
  body { font-family: var(--font); color: var(--mr-text); box-sizing: border-box; }
  * { box-sizing: border-box; }

  .topbar {
    display: flex; align-items: center;
    gap: 14px;
    height: 76px; padding: 0 24px;
    background: var(--mr-surface);
    border-bottom: 1px solid var(--mr-border);
  }

  /* Brand */
  .brand { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .brand-icon {
    width: 44px; height: 44px;
    background: var(--mr-primary); color: #fff;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(15, 18, 36, 0.22);
  }
  .brand-mono { font-family: var(--font); font-weight: 600; font-size: 24px; line-height: 1; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-text strong { font-size: 16px; font-weight: 700; color: var(--mr-text); }
  .brand-text span {
    font-family: var(--mono); font-size: 10px;
    color: var(--mr-text-3); letter-spacing: 0.18em; text-transform: uppercase;
  }

  /* Right cluster */
  .tools { display: flex; align-items: center; gap: 12px; margin-inline-start: auto; }

  /* Clock — split into time + tiny date label */
  .clock {
    display: inline-flex; flex-direction: column; align-items: flex-end;
    line-height: 1;
    padding: 0 4px;
    color: var(--mr-text);
    text-align: right;
  }
  .clock__time {
    font-family: var(--mono);
    font-variant-numeric: lining-nums tabular-nums;
    font-size: 15px;
    font-weight: 500;
    color: var(--mr-text);
    letter-spacing: 0;
    unicode-bidi: plaintext;
  }
  .clock__time .ampm {
    font-size: 10px; font-weight: 500;
    color: var(--mr-text-3);
    margin-inline-start: 4px;
    letter-spacing: 0.08em;
  }
  .clock__date {
    margin-top: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--mr-text-3);
    letter-spacing: 0.06em;
    unicode-bidi: plaintext;
  }

  .divider {
    width: 1px; height: 32px;
    background: var(--mr-border);
  }

  /* Icon buttons */
  .iconbtn {
    width: 40px; height: 40px;
    border: 1px solid var(--mr-border);
    background: var(--mr-surface);
    color: var(--mr-text-2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
  }
  .iconbtn:hover { background: var(--mr-primary-softer); color: var(--mr-primary); }
  .iconbtn .dot {
    position: absolute; top: -3px; left: -3px;
    background: var(--mr-danger); color: #fff;
    font-size: 9px; font-weight: 700;
    min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--mr-surface);
    font-family: var(--mono);
  }

  /* User chip — bigger avatar, presence dot, name + role */
  .user {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 14px 6px 6px;
    background: var(--mr-bg);
    border: 1px solid var(--mr-border);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .user:hover { background: var(--mr-primary-softer); border-color: var(--mr-primary-soft); }
  .av-wrap { position: relative; flex-shrink: 0; }
  .av {
    width: 36px; height: 36px;
    background: var(--mr-primary); color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .av-presence {
    position: absolute;
    bottom: 0; right: 0;
    width: 11px; height: 11px;
    background: var(--mr-success);
    border-radius: 50%;
    border: 2px solid var(--mr-surface);
    box-sizing: border-box;
  }
  .uinfo {
    display: flex; flex-direction: column;
    line-height: 1.15; min-width: 0;
  }
  .uname {
    font-size: 13px;
    font-weight: 700;
    color: var(--mr-text);
    white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    max-width: 140px;
  }
  .urole {
    margin-top: 3px;
    font-size: 10px;
    color: var(--mr-text-3);
    font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .urole .role-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--mr-primary);
  }
  .ucaret {
    color: var(--mr-text-3);
    font-size: 10px;
    margin-inline-start: 2px;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-icon"><span class="brand-mono">م</span></div>
    <div class="brand-text">
      <strong>منصة الرصد</strong>
    </div>
  </div>

  <div class="tools">
    <div class="clock" dir="ltr">
      <div class="clock__time"><span class="num">07:42</span><span class="ampm">PM</span></div>
      <div class="clock__date">Mon, 12 Apr 2026</div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <button class="iconbtn" title="التنبيهات">
      <i class="fas fa-bell"></i>
      <span class="dot num">3</span>
    </button>
    <button class="iconbtn" title="تبديل الوضع">
      <i class="fas fa-moon"></i>
    </button>

    <div class="user">
      <div class="av-wrap">
        <div class="av">ر</div>
        <span class="av-presence" aria-hidden="true"></span>
      </div>
      <div class="uinfo">
        <strong class="uname">رنا الزهراني</strong>
        <span class="urole"><span class="role-dot"></span> مدير النظام</span>
      </div>
      <i class="fas fa-chevron-down ucaret" aria-hidden="true"></i>
    </div>
  </div>
</header>
</body>
</html>
