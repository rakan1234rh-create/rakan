<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--mr-text); padding: 22px 24px; box-sizing: border-box; }
  * { box-sizing: border-box; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; min-height: 40px;
    background: var(--mr-surface); color: var(--mr-primary);
    border: 1px solid var(--mr-primary-soft);
    border-radius: 999px;
    font-family: var(--font); font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--mr-primary); color: #fff; border-color: var(--mr-primary); box-shadow: 0 6px 16px rgba(15, 18, 36, 0.28); }
  .btn-success { background: var(--mr-success); color: #fff; border-color: var(--mr-success); }
  .btn-danger  { background: var(--mr-danger);  color: #fff; border-color: var(--mr-danger); }
  .btn-warning { background: var(--mr-warning); color: #2a2200; border-color: var(--mr-warning); }
  .btn-ghost   { background: transparent; border-color: transparent; color: var(--mr-text-2); }
  .btn-sm      { padding: 7px 14px; min-height: 32px; font-size: 12px; }
  
  .row { display:flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .row:last-child { margin-bottom: 0; }
  .lbl { font-family: var(--mono); font-size: 10px; color: var(--mr-text-3); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; min-width: 110px; }

</style>
</head>
<body>
<div class="row">
  <span class="lbl">Primary</span>
  <button class="btn btn-primary"><i class="fas fa-circle-plus"></i> رصد مخالفة</button>
  <button class="btn btn-primary btn-sm"><i class="fas fa-check"></i> اعتماد</button>
  <button class="btn btn-primary" disabled style="opacity:0.55;cursor:not-allowed">معطّل</button>
</div>
<div class="row">
  <span class="lbl">Secondary</span>
  <button class="btn"><i class="fas fa-filter"></i> فرز بواسطة</button>
  <button class="btn btn-sm"><i class="fas fa-download"></i> تصدير</button>
  <button class="btn btn-ghost"><i class="fas fa-xmark"></i> إلغاء</button>
</div>
<div class="row">
  <span class="lbl">Semantic</span>
  <button class="btn btn-success"><i class="fas fa-check-double"></i> موافقة</button>
  <button class="btn btn-danger"><i class="fas fa-ban"></i> رفض</button>
  <button class="btn btn-warning"><i class="fas fa-bell"></i> تنبيه إداري</button>
</div>
</body></html>
