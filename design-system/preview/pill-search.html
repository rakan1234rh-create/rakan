<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--mr-text); padding: 22px 24px; box-sizing: border-box; }
  * { box-sizing: border-box; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; min-height: 40px;
    background: var(--mr-surface); color: var(--mr-primary);
    border: 1px solid var(--mr-primary-soft);
    border-radius: 999px;
    font-family: var(--font); font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--mr-primary); color: #fff; border-color: var(--mr-primary); box-shadow: 0 6px 16px rgba(15, 18, 36, 0.28); }
  .btn-success { background: var(--mr-success); color: #fff; border-color: var(--mr-success); }
  .btn-danger  { background: var(--mr-danger);  color: #fff; border-color: var(--mr-danger); }
  .btn-warning { background: var(--mr-warning); color: #2a2200; border-color: var(--mr-warning); }
  .btn-ghost   { background: transparent; border-color: transparent; color: var(--mr-text-2); }
  .btn-sm      { padding: 7px 14px; min-height: 32px; font-size: 12px; }
  
  .stack { display:flex; flex-direction:column; gap: 14px; }
  .search-wrap {
    height: 44px;
    border: 1px solid var(--mr-border);
    border-radius: 999px;
    background: var(--mr-bg);
    display: flex; align-items: center;
    direction: rtl; padding: 0 16px 0 8px;
    gap: 10px;
  }
  .search-wrap.focus { border-color: var(--mr-primary); box-shadow: 0 0 0 4px var(--mr-primary-soft); background: var(--mr-surface); }
  .search-input { flex: 1; border: 0; outline: none; background: transparent; text-align: start; font-family: var(--font); font-size: 13px; color: var(--mr-text); }
  .search-input::placeholder { color: var(--mr-text-muted); }
  .search-btn { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--mr-text-3); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .lbl { font-family: var(--mono); font-size: 10px; color: var(--mr-text-3); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }

</style>
</head>
<body>
<div class="stack">
  <div>
    <div class="lbl" style="margin-bottom:6px">Default</div>
    <div class="search-wrap">
      <input class="search-input" type="text" placeholder="ابحث في التذاكر، المخالفات، الموظفين، والفروع...">
      <button class="search-btn"><i class="fas fa-magnifying-glass"></i></button>
    </div>
  </div>
  <div>
    <div class="lbl" style="margin-bottom:6px">Focused</div>
    <div class="search-wrap focus">
      <input class="search-input" type="text" value="مخالفات بانتظار التدقيق">
      <button class="search-btn"><i class="fas fa-magnifying-glass"></i></button>
    </div>
  </div>
</div>
</body></html>
