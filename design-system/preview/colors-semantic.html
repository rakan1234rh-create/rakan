<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: var(--font); color: var(--mr-text); padding: 20px; box-sizing: border-box; }
  * { box-sizing: border-box; }
  
  .row { display:flex; gap:14px; }
  .sw { flex:1; min-width:0; }
  .chip { height: 76px; border-radius: 14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size: 22px; }
  .meta { margin-top: 8px; }
  .meta .name { font-size: 12px; color: var(--mr-text); font-weight: 700; }
  .meta .val { font-size: 11px; color: var(--mr-text-3); font-family: var(--mono); display:block; margin-top: 2px; }

</style>
</head>
<body>
<div class="row">
  <div class="sw">
    <div class="chip" style="background:#16a34a"><i class="fas fa-check"></i></div>
    <div class="meta"><span class="name">Success</span><span class="val">#16a34a</span></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#f59e0b"><i class="fas fa-triangle-exclamation"></i></div>
    <div class="meta"><span class="name">Warning</span><span class="val">#f59e0b</span></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#ef4444"><i class="fas fa-xmark"></i></div>
    <div class="meta"><span class="name">Danger</span><span class="val">#ef4444</span></div>
  </div>
  <div class="sw">
    <div class="chip" style="background:#0f1224;font-family:var(--font);font-weight:800;font-size:26px"><span>م</span></div>
    <div class="meta"><span class="name">Primary</span><span class="val">#0f1224</span></div>
  </div>
</div>
</body></html>
