<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الصفحة غير موجودة — ATHAR</title>
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mu:#6b6b6b;--ln:#e4e4e4}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--fg:#f2f2f2;--mu:#a3a3a3;--ln:#262626}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;text-align:center;padding:24px}
.w{display:block;width:180px;height:44px;margin:0 auto 40px;background:var(--fg);-webkit-mask:url(/icons/redesign/athar-wordmark.svg) center/contain no-repeat;mask:url(/icons/redesign/athar-wordmark.svg) center/contain no-repeat}
.k{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.16em;color:var(--mu)}
.n{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:88px;line-height:1;margin:12px 0}
h1{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;font-weight:600;font-size:26px;margin:8px 0}
p{color:var(--mu);max-width:420px;margin:8px auto 28px;line-height:1.8}
a{display:inline-block;background:var(--fg);color:var(--bg);text-decoration:none;padding:13px 28px;border-radius:4px;font-weight:600}
hr{border:0;border-top:1px solid var(--ln);width:60px;margin:0 auto 24px}
</style></head><body><main><span class="w" role="img" aria-label="ATHAR"></span><div class="k">ERROR 404</div><div class="n">404</div><h1>الصفحة غير موجودة</h1><p>الرابط الذي فتحته غير صحيح أو تم نقله.</p><a href="/">العودة إلى الرئيسية</a></main></body></html>
