<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" class="athar-staging-redesign mr-desktop-ui mr-users-tab-active">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATHAR — معاينة دليل المستخدمين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="styles/custom/athar-users-redesign.css?v=usr7" />
  <style>
    :root {
      --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
      --mr-primary: #0f1224;
      --mr-bg: #ffffff;
      --mr-bg-2: #f5f5f7;
      --mr-surface: #ffffff;
      --mr-border: #e2e2e6;
      --mr-text: #111111;
      --mr-text-2: #5c5c66;
      --mr-text-3: #8e8e93;
      --surface: #ffffff;
      --surface2: #f5f5f7;
      --border: #e2e2e6;
      --text: #111111;
      --text2: #5c5c66;
      --text3: #8e8e93;
    }
    html[data-theme="dark"] {
      --mr-bg: #111113;
      --mr-bg-2: #18181c;
      --mr-surface: #1c1c21;
      --mr-border: #2e2e36;
      --mr-text: #f2f2f4;
      --mr-text-2: #b0b0b8;
      --mr-text-3: #7d7d86;
      --surface: #1c1c21;
      --surface2: #131316;
      --border: #2e2e36;
      --text: #f2f2f4;
      --text2: #b0b0b8;
      --text3: #7d7d86;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: var(--font); background: var(--mr-bg-2); color: var(--mr-text); }
    #appWrap { height: 100%; display: flex; flex-direction: column; }
    .topbar { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--mr-surface); border-bottom: 1px solid var(--mr-border); }
    .brand-icon img { width: 30px; height: 30px; object-fit: contain; display: block; }
    .brand-name { font-weight: 700; letter-spacing: -0.03em; }
    .theme-toggle { margin-inline-start: auto; border: 1px solid var(--mr-border); background: transparent; color: var(--mr-text); padding: 8px 12px; min-height: 40px; font: inherit; cursor: pointer; }
    .main { flex: 1 1 auto; min-height: 0; height: 0; display: flex; flex-direction: column; }
    .content { flex: 1 1 auto; min-height: 0; height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    .tab-content { display: none; }
    .tab-content.active { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; height: 0; overflow: hidden; }
    .users-io-menu { display: none; }
    .wf-status-select-native { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  </style>
</head>
<body>
  <div id="appWrap" class="rbac-ready">
    <header class="topbar">
      <div class="brand-icon"><img src="../../icons/athar-logo-v403.png" alt="ATHAR" width="30" height="30" /></div>
      <div class="brand-name">أثر</div>
      <button type="button" class="theme-toggle" id="themeToggle">وضع داكن</button>
    </header>
    <div class="main"><div class="content">
      <div class="tab-content active" id="tab-departments"></div>
    </div></div>
  </div>
  <script>
    const USERS = [
      { name: 'نورة العتيبي', role: 'admin', roleLabel: 'مدير النظام', emp: '10001', branch: '—', phone: '0501112233', email: 'noura@athar.sa' },
      { name: 'خالد السبيعي', role: 'manager', roleLabel: 'المدير', emp: '10018', branch: 'الإدارة العامة', phone: '0559988776', email: 'khaled@athar.sa' },
      { name: 'سارة القحطاني', role: 'auditor', roleLabel: 'إدارة الرقابة الداخلية', emp: '10042', branch: '—', phone: '0533344556', email: 'sara@athar.sa' },
      { name: 'فهد الدوسري', role: 'supervisor', roleLabel: 'المشرف', emp: '10105', branch: 'فرع الرياض', phone: '0541122334', email: 'fahad@athar.sa' },
      { name: 'ريم الحربي', role: 'branch_manager', roleLabel: 'مدير الفرع', emp: '10220', branch: 'فرع جدة', phone: '0566677889', email: 'reem@athar.sa' },
      { name: 'عبدالله الشمري', role: 'employee', roleLabel: 'أخصائي مبيعات', emp: '10331', branch: 'فرع الدمام', phone: '0590011223', email: 'abdullah@athar.sa' },
      { name: 'لينا العتيبي', role: 'employee', roleLabel: 'أخصائي مبيعات', emp: '10340', branch: 'فرع الرياض', phone: '0502223344', email: 'lina@athar.sa' },
      { name: 'ماجد الحربي', role: 'observer', roleLabel: 'الراصد', emp: '10401', branch: '—', phone: '0556677889', email: 'majid@athar.sa' }
    ];
    const ORDER = ['admin','manager','auditor','hr','supervisor','branch_manager','observer','employee'];
    const LABELS = { admin:'مدير النظام', manager:'المدير', auditor:'إدارة الرقابة الداخلية', hr:'الموارد البشرية', supervisor:'المشرف', branch_manager:'مدير الفرع', observer:'الراصد', employee:'الموظف' };

    function railHTML(active='') {
      const counts = {};
      USERS.forEach(u => { counts[u.role] = (counts[u.role]||0)+1; });
      let html = `<div class="usr-rail__label">الأدوار</div>
        <button type="button" class="usr-rail__btn${active===''?' is-active':''}"><span>الكل</span><span class="usr-rail__n">${USERS.length}</span></button>`;
      ORDER.forEach(r => {
        if (!counts[r]) return;
        html += `<button type="button" class="usr-rail__btn${active===r?' is-active':''}"><span>${LABELS[r]}</span><span class="usr-rail__n">${counts[r]}</span></button>`;
      });
      return html;
    }

    function rosterHTML(compact) {
      const groups = {};
      USERS.forEach(u => { (groups[u.role]||(groups[u.role]=[])).push(u); });
      let i=0, html='';
      ORDER.forEach(role => {
        const list = groups[role]; if (!list) return;
        html += `<div class="usr-sec"><span>${LABELS[role]}</span><span class="usr-sec__n">${list.length}</span></div>`;
        list.forEach(u => {
          const delay = Math.min(0.2, i++ * 0.02);
          const meta = compact ? `${u.emp} · ${u.roleLabel}` : u.phone;
          html += `<article class="usr-row" role="listitem" style="animation-delay:${delay}s">
            <span class="usr-row__av">${u.name.charAt(0)}<i class="usr-row__dot is-on"></i></span>
            <div class="usr-row__who"><div class="usr-row__name">${u.name}</div><div class="usr-row__meta">${meta}</div></div>
            <div class="usr-row__emp">${u.emp}</div>
            <div class="usr-row__branch">${u.branch}</div>
            <div class="usr-row__mail">${u.email}</div>
            <div class="usr-row__acts">
              <button type="button" class="usr-row__act" aria-label="تعديل"><i class="fas fa-pen"></i><span>تعديل</span></button>
              <button type="button" class="usr-row__act usr-row__act--danger" aria-label="تعطيل"><i class="fas fa-trash"></i><span>تعطيل</span></button>
            </div>
          </article>`;
        });
      });
      return html;
    }

    function mount() {
      const params = new URLSearchParams(location.search);
      const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
      const mobile = params.get('mobile') === '1';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('mr-desktop-ui', !mobile);
      document.documentElement.classList.toggle('mr-mobile-ui', mobile);
      document.documentElement.classList.add('athar-staging-redesign','mr-users-tab-active');
      const tab = document.getElementById('tab-departments');
      tab.innerHTML = `
        <div class="panel wf-panel usr-board">
          <header class="usr-board__masthead">
            <div class="usr-board__titles">
              <h2 class="wf-panel-title usr-board__title">إدارة المستخدمين</h2>
              <p class="wf-panel-sub usr-board__sub">ابحث وعيّن الأدوار من دليل واحد</p>
            </div>
            <div class="usr-board__mast-actions">
              <button type="button" class="usr-board__add"><i class="fas fa-user-plus"></i><span>مستخدم جديد</span></button>
            </div>
          </header>
          <div class="usr-board__command">
            <label class="usr-board__search"><i class="fas fa-magnifying-glass"></i>
              <input class="usr-board__search-input" placeholder="اسم، رقم وظيفي، بريد، جوال…" />
            </label>
            <div class="usr-board__status">
              <button type="button" class="usr-seg is-active">نشط</button>
              <button type="button" class="usr-seg">الكل</button>
            </div>
            <div class="usr-board__tools">
              <button type="button" class="usr-tool" aria-label="تصدير"><i class="fas fa-file-export"></i></button>
              <button type="button" class="usr-tool" aria-label="قالب"><i class="fas fa-file-download"></i></button>
              <button type="button" class="usr-tool usr-tool--more" aria-label="المزيد"><i class="fas fa-ellipsis"></i></button>
            </div>
            <div class="usr-board__count"><strong id="users-count-desk">${USERS.length}</strong><span>نتيجة</span><strong id="users-count" class="usr-board__count-mob">${USERS.length}</strong></div>
          </div>
          <div id="usersDeskHost" class="usr-board__body">
            <aside id="usersRoleRail" class="usr-rail">${railHTML()}</aside>
            <div class="usr-roster-shell"><div id="usersList" class="mr-users-list usr-roster" role="list">${rosterHTML(mobile)}</div></div>
          </div>
        </div>`;
      const btn = document.getElementById('themeToggle');
      btn.textContent = theme === 'dark' ? 'وضع فاتح' : 'وضع داكن';
      btn.onclick = () => {
        const q = new URLSearchParams(location.search);
        q.set('theme', theme === 'dark' ? 'light' : 'dark');
        location.search = q.toString();
      };
    }
    mount();
  </script>
</body>
</html>
