name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare site
        run: |
          npm install sharp --no-save
          node scripts/export-athar-homescreen-png.mjs
          mkdir -p site/icons
          cp index.html site/index.html
          cp manifest.webmanifest site/manifest.webmanifest
          cp icons/athar-icon-192.png icons/athar-icon-512.png icons/athar-icon-maskable-512.png \
            icons/athar-apple-touch-180.png icons/athar-app-icon.svg \
            icons/athar-homescreen-fullbleed.svg icons/athar-homescreen-maskable.svg site/icons/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
