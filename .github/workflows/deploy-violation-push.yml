name: Deploy push functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/violation-push/**'
      - 'supabase/functions/violation-auto-forward/**'
      - 'supabase/functions/r2-storage/**'
      - 'supabase/functions/send-auth-emails/**'
      - 'supabase/functions/email-unsubscribe/**'
      - 'supabase/functions/password-recovery/**'
      - 'supabase/functions/employee-login/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/admin-users/**'
      - 'supabase/config.toml'
      - 'supabase/email-templates/**'
      - '.github/workflows/deploy-violation-push.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # workflow_dispatch من ref آخر لا ينشر إلى مشروع الإنتاج.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require reviewed Edge release approval
        env:
          RELEASE_APPROVED: ${{ vars.ATHAR_SECURITY_EDGE_RELEASE_APPROVED }}
        run: |
          if [ "$RELEASE_APPROVED" != "true" ]; then
            echo "::error::Edge deployment is blocked until the reviewed security release is approved and its prerequisites are prepared."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: 2.30.4

      - name: Verify all Edge function sources are present
        run: |
          set -euo pipefail
          for fn in \
            violation-push \
            r2-storage \
            send-auth-emails \
            email-unsubscribe \
            password-recovery \
            employee-login \
            admin-users
          do
            test -f "supabase/functions/${fn}/index.ts" || {
              echo "::error::Missing source for ${fn}; merge its reviewed implementation before deployment."
              exit 1
            }
          done

      - name: Deploy Edge functions to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: cmdkldxbocbpiptdodmp
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::╪ú╪╢┘ü SUPABASE_ACCESS_TOKEN ┘ü┘è GitHub ΓåÆ Settings ΓåÆ Secrets ΓåÆ Actions"
            echo "::error::╪ú┘ê ╪º┘å╪┤╪▒ ┘è╪»┘ê┘è╪º┘ï ┘à┘å Supabase Dashboard ΓåÆ Edge Functions ΓåÆ violation-push"
            exit 1
          fi
          # These endpoints accept a verified webhook, signed link, service/cron secret,
          # or unauthenticated bootstrap request and therefore verify inside the handler.
          supabase functions deploy violation-push --no-verify-jwt --project-ref "$PROJECT_ID" --use-api
          supabase functions deploy r2-storage --no-verify-jwt --project-ref "$PROJECT_ID" --use-api
          supabase functions deploy send-auth-emails --no-verify-jwt --project-ref "$PROJECT_ID" --use-api
          supabase functions deploy email-unsubscribe --no-verify-jwt --project-ref "$PROJECT_ID" --use-api
          supabase functions deploy password-recovery --no-verify-jwt --project-ref "$PROJECT_ID" --use-api
          supabase functions deploy employee-login --no-verify-jwt --project-ref "$PROJECT_ID" --use-api
          # Privileged user management always carries a Supabase user JWT; keep gateway
          # verification enabled in addition to the role and active-account checks inside.
          supabase functions deploy admin-users --project-ref "$PROJECT_ID" --use-api
