name: Deploy violation-push

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/violation-push/**'
      - '.github/workflows/deploy-violation-push.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy violation-push to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: rizoafuxmqsddjfhbsmf
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::أضف SUPABASE_ACCESS_TOKEN في GitHub → Settings → Secrets → Actions"
            exit 1
          fi
          supabase functions deploy violation-push --no-verify-jwt --project-ref "$PROJECT_ID"
