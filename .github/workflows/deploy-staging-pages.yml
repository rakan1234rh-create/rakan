name: Deploy staging site

# ينشر من فرع staging فقط — دون تعديل أي ملف في main.
# الجذر = نسخة الإنتاج الحالية من main
# /staging/ = فرع staging (المنصة الاختبارية)
#
# مطلوب مرة واحدة منك:
# Settings → Environments → github-pages → Deployment branches
# أضف فرع: staging
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # مجموعة منفصلة عن production؛ لا نلغي الجاري حتى لا يُلغى نشر Pages لنفس الـ SHA
  group: pages-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          path: staging-src
          ref: staging

      - name: Checkout main (production root only — read-only)
        uses: actions/checkout@v4
        with:
          path: main-src
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/configure-pages@v5

      - name: Build production root + /staging
        run: |
          set -euo pipefail

          build_site() {
            local SRC="$1"
            local DEST="$2"
            local LABEL="$3"
            mkdir -p "$DEST/icons"
            (
              cd "$SRC"
              npm install sharp @resvg/resvg-js --no-save
              node scripts/export-athar-homescreen-png.mjs
              VER="$(tr -d '\r\n' < icons/icon-cache-ver.txt)"
              SHORT_SHA="$(git rev-parse --short HEAD)"
              cp index.html "$DEST/index.html"
              # athar-build يجب أن يطابق app-version.json.build حرفياً وإلا يحدث رفرش لا نهائي
              sed -i "s/<meta name=\"athar-build\" content=\"[^\"]*\">/<meta name=\"athar-build\" content=\"${SHORT_SHA}\">/" "$DEST/index.html"
              sed -i "s|src=\"js/app.js\\(?v=[^\"]*\\)\\?\"|src=\"js/app.js?v=${SHORT_SHA}\"|g" "$DEST/index.html"
              sed -i "s|href=\"styles/custom/athar-redesign-staging.css\\(?v=[^\"]*\\)\\?\"|href=\"styles/custom/athar-redesign-staging.css?v=${SHORT_SHA}\"|g" "$DEST/index.html"
              printf '%s\n' "{\"build\":\"${SHORT_SHA}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"env\":\"${LABEL}\"}" > "$DEST/app-version.json"
              cp -r styles "$DEST/"
              if [ -d js ]; then cp -r js "$DEST/"; fi
              cp -r vendor "$DEST/"
              test -f "$DEST/vendor/ffmpeg/worker.js"
              cp manifest.webmanifest "$DEST/manifest.webmanifest"
              if [ -f sw.js ]; then cp sw.js "$DEST/sw.js"; fi
              cp icons/athar-pwa-192-v${VER}.png icons/athar-pwa-512-v${VER}.png \
                icons/athar-pwa-180-v${VER}.png icons/athar-pwa-maskable-512-v${VER}.png \
                icons/athar-app-icon.svg icons/athar-homescreen-fullbleed.svg \
                icons/athar-homescreen-maskable.svg icons/athar-wordmark-email.svg \
                icons/athar-wordmark-email-v388.png icons/athar-logo-v401.png "$DEST/icons/"
              # أصول الشعار الجديدة قد تكون على staging فقط — انسخ الموجود دون كسر بناء main
              for f in \
                icons/athar-wordmark-email-v402.png \
                icons/athar-logo-v402.png \
                icons/athar-logo-v402.svg \
                icons/athar-logo-v402-on-light.png \
                icons/athar-logo-v402-on-light.svg
              do
                if [ -f "$f" ]; then cp "$f" "$DEST/icons/"; fi
              done
              if [ -d icons/avatars ]; then mkdir -p "$DEST/icons/avatars" && cp -r icons/avatars/. "$DEST/icons/avatars/"; fi
              if [ -d icons/redesign ]; then mkdir -p "$DEST/icons/redesign" && cp -r icons/redesign/. "$DEST/icons/redesign/"; fi
              if [ -d design ]; then cp -r design "$DEST/"; fi
              touch "$DEST/.nojekyll"
              cp icons/athar-pwa-180-v${VER}.png "$DEST/apple-touch-icon.png"
              cp icons/athar-pwa-180-v${VER}.png "$DEST/apple-touch-icon-precomposed.png"
              cp icons/athar-pwa-180-v${VER}.png "$DEST/icons/apple-touch-icon.png"
              cp icons/athar-pwa-512-v${VER}.png "$DEST/favicon.png"
            )
          }

          rm -rf site
          mkdir -p site
          build_site "$GITHUB_WORKSPACE/main-src" "$GITHUB_WORKSPACE/site" "production"
          if [ -f "$GITHUB_WORKSPACE/main-src/CNAME" ]; then
            cp "$GITHUB_WORKSPACE/main-src/CNAME" "$GITHUB_WORKSPACE/site/CNAME"
          fi
          build_site "$GITHUB_WORKSPACE/staging-src" "$GITHUB_WORKSPACE/site/staging" "staging"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://athar-app.online/staging/
    # أطول من طابور Pages؛ نستطلع بدون إلغاء حتى لا يُسمَّم الـ SHA
    timeout-minutes: 50
    steps:
      - name: Pause before Pages deploy
        run: sleep 30

      # لا نستخدم actions/deploy-pages: مهلتها 10 دقائق ثم تلغي النشر،
      # وإعادة المحاولة لنفس الـ SHA تعطي فوراً «Deployment cancelled».
      - name: Deploy to GitHub Pages (long poll, no cancel)
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.sha
            const pollMs = 15000
            const maxWaitMs = 40 * 60 * 1000
            const started = Date.now()

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              per_page: 100
            })
            const artifact = artifacts.data.artifacts.find((a) => a.name === 'github-pages' && !a.expired)
            if (!artifact) {
              throw new Error('github-pages artifact not found for this run')
            }
            core.info(`Using artifact_id=${artifact.id}`)

            const oidcToken = await core.getIDToken()
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: artifact.id,
              pages_build_version: sha,
              oidc_token: oidcToken
            })
            // واجهة Pages تستخدم غالباً الـ SHA كمعرّف للنشر
            const pagesDeploymentId = created.data.id || sha
            core.info(`Created Pages deployment id=${pagesDeploymentId}`)
            if (created.data.page_url) {
              core.info(`page_url=${created.data.page_url}`)
            }
            core.setOutput('page_url', created.data.page_url || 'https://athar-app.online/staging/')

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
            let lastStatus = 'unknown'
            while (Date.now() - started < maxWaitMs) {
              await sleep(pollMs)
              let statusPayload
              try {
                statusPayload = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}',
                  { owner, repo, pages_deployment_id: pagesDeploymentId }
                )
              } catch (err) {
                core.warning(`Status poll error: ${err.message}`)
                continue
              }
              lastStatus = statusPayload.data.status || statusPayload.data.state || 'unknown'
              core.info(`Pages status: ${lastStatus}`)
              if (lastStatus === 'succeed' || lastStatus === 'success' || lastStatus === 'deployed') {
                core.info('Pages deployment succeeded')
                return
              }
              if (lastStatus === 'deployment_failed' || lastStatus === 'failed' || lastStatus === 'error') {
                throw new Error(`Pages deployment failed with status=${lastStatus}`)
              }
              if (lastStatus === 'canceled' || lastStatus === 'cancelled') {
                throw new Error('Pages deployment was cancelled by GitHub (not by this job)')
              }
            }

            // لا نلغي النشر — قد يكتمل لاحقاً بعد انتهاء الطابور
            core.warning(
              `Timed out after ${Math.round(maxWaitMs / 60000)}m still at status=${lastStatus}. ` +
                'Leaving deployment running (no cancel). Re-run workflow_dispatch if site stays stale.'
            )
            core.setFailed(`Pages still queued/in progress after long poll (last=${lastStatus})`)
