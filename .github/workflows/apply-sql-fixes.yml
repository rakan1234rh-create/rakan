name: Apply SQL fixes

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'SQL file under supabase/ to run'
        required: true
        default: 'fix-athar-notif-emit-role-enum-cast.sql'
  push:
    branches: [main]
    paths:
      - 'supabase/fix-athar-notif-emit-role-enum-cast.sql'
      - 'supabase/test-forward-v2026-0317-3min.sql'
      - 'supabase/verify-forward-v2026-0317.sql'
      - '.github/workflows/apply-sql-fixes.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply SQL via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: rizoafuxmqsddjfhbsmf
          SQL_FILE: ${{ github.event.inputs.sql_file || 'fix-athar-notif-emit-role-enum-cast.sql' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN missing — run SQL manually in Supabase SQL Editor"
            exit 1
          fi
          if [ ! -f "supabase/$SQL_FILE" ]; then
            echo "::error::File not found: supabase/$SQL_FILE"
            exit 1
          fi
          QUERY=$(python3 -c 'import json,sys; print(json.dumps(open(sys.argv[1],encoding="utf-8").read()))' "supabase/$SQL_FILE")
          HTTP=$(curl -sS -o /tmp/sql_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": ${QUERY}}")
          echo "HTTP $HTTP"
          cat /tmp/sql_resp.json
          test "$HTTP" = "200" || test "$HTTP" = "201"
