name: Apply SQL fixes

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'SQL file under supabase/migrations/ only (e.g. 20261009120000_harden_append_violation_log_auth.sql)'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and apply SQL via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: cmdkldxbocbpiptdodmp
          SQL_FILE: ${{ github.event.inputs.sql_file }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN missing — apply SQL manually or fix the secret"
            exit 1
          fi
          if [ -z "${SQL_FILE:-}" ]; then
            echo "::error::sql_file input is required"
            exit 1
          fi
          # Only allow migration files — no arbitrary supabase/*.sql from push
          case "$SQL_FILE" in
            migrations/*.sql) ;;
            *)
              echo "::error::Only paths under migrations/*.sql are allowed (got: $SQL_FILE)"
              exit 1
              ;;
          esac
          if [ ! -f "supabase/$SQL_FILE" ]; then
            echo "::error::File not found: supabase/$SQL_FILE"
            exit 1
          fi
          echo "Applying supabase/$SQL_FILE"
          QUERY=$(python3 -c 'import json,sys; print(json.dumps(open(sys.argv[1],encoding="utf-8").read()))' "supabase/$SQL_FILE")
          HTTP=$(curl -sS -o /tmp/sql_resp.json -w "%{http_code}" \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": ${QUERY}}")
          echo "HTTP $HTTP for $SQL_FILE"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            # Truncate body — never dump full SQL responses/secrets to logs
            python3 - <<'PY'
          import json
          try:
            raw = open("/tmp/sql_resp.json", encoding="utf-8").read()
          except OSError:
            raw = ""
          print((raw[:400] + ("…" if len(raw) > 400 else "")) or "(empty body)")
          PY
            exit 1
          fi
          echo "Applied OK (response omitted)"
