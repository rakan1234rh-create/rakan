<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#131316;font-family:Segoe UI,Tahoma,Arial,sans-serif;">
  <tr>
    <td align="center" style="padding:40px 20px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;background-color:#1c1c21;border-radius:16px;border:1px solid #2a2a30;">
        <tr>
          <td align="center" style="padding:32px 28px 16px;">
            <div style="font-family:Georgia,Times New Roman,serif;font-size:40px;color:#ffffff;letter-spacing:0.06em;">ATHAR</div>
            <div style="font-size:13px;color:#a1a1aa;margin-top:8px;">منصة الرصد المتكاملة</div>
          </td>
        </tr>
        <tr>
          <td dir="rtl" style="padding:8px 28px 28px;text-align:right;">
            <p style="margin:0 0 16px;font-size:16px;line-height:1.7;color:#fafafa;">مرحباً،</p>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.75;color:#c8c8d0;">تلقّينا طلباً لإعادة تعيين كلمة المرور للحساب: <span dir="ltr" style="color:#fafafa;">{{ .Email }}</span></p>
            <p style="margin:0 0 10px;font-size:14px;line-height:1.7;color:#c8c8d0;text-align:center;">رمز التحقق الخاص بك:</p>
            <p dir="ltr" style="margin:0 0 24px;text-align:center;font-size:34px;letter-spacing:0.25em;font-weight:800;color:#ffffff;background-color:#131316;border:1px solid #2a2a30;border-radius:14px;padding:16px 18px;">
              {{ .Token }}
            </p>
            <p style="margin:0 0 18px;font-size:13px;line-height:1.7;color:#a1a1aa;text-align:center;">اكتب هذا الرمز في صفحة استعادة كلمة المرور داخل المنصة.</p>
            <p style="margin:0 0 24px;text-align:center;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;color:#fafafa;text-decoration:underline;font-size:13px;">فتح رابط احتياطي لإعادة التعيين</a>
            </p>
            <p style="margin:0;font-size:13px;line-height:1.65;color:#87879a;">إذا لم تطلب ذلك، تجاهل هذه الرسالة.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
