<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <style>
    :root { color-scheme: light only; supported-color-schemes: light; }
    body { margin: 0; padding: 0; background-color: #f4f4f5 !important; }
    .email-bg { background-color: #f4f4f5 !important; }
    .email-card { background-color: #ffffff !important; border-color: #e4e4e7 !important; }
    .email-title { color: #18181b !important; }
    .email-body { color: #3f3f46 !important; }
    .email-muted { color: #71717a !important; }
    .email-token { color: #18181b !important; background-color: #fafafa !important; border-color: #e4e4e7 !important; }
    .email-copy { color: #52525b !important; }
    @media (prefers-color-scheme: dark) {
      body, .email-bg { background-color: #f4f4f5 !important; }
      .email-card { background-color: #ffffff !important; border-color: #e4e4e7 !important; }
      .email-title { color: #18181b !important; }
      .email-body { color: #3f3f46 !important; }
      .email-muted { color: #71717a !important; }
      .email-token { color: #18181b !important; background-color: #fafafa !important; border-color: #e4e4e7 !important; }
      .email-copy { color: #52525b !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;">
<table role="presentation" class="email-bg" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f4f4f5" style="background-color:#f4f4f5;font-family:Segoe UI,Tahoma,Arial,sans-serif;">
  <tr>
    <td align="center" bgcolor="#f4f4f5" style="padding:40px 20px;background-color:#f4f4f5;">
      <table role="presentation" class="email-card" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="max-width:480px;background-color:#ffffff;border-radius:16px;border:1px solid #e4e4e7;">
        <tr>
          <td align="center" bgcolor="#ffffff" style="padding:32px 28px 16px;background-color:#ffffff;">
            <img src="https://rakan1234rh-create.github.io/rakan/icons/athar-wordmark-email-v388.png?v=2" width="240" height="148" alt="ATHAR" style="display:block;width:240px;max-width:100%;height:auto;border:0;margin:0 auto;">
          </td>
        </tr>
        <tr>
          <td dir="rtl" bgcolor="#ffffff" style="padding:8px 28px 28px;text-align:right;background-color:#ffffff;">
            <p class="email-title" style="margin:0 0 16px;font-size:16px;line-height:1.7;color:#18181b;">مرحباً،</p>
            <p class="email-body" style="margin:0 0 24px;font-size:15px;line-height:1.75;color:#3f3f46;">تلقّينا طلباً لإعادة تعيين كلمة المرور لحسابك.</p>
            <p class="email-body" style="margin:0 0 10px;font-size:14px;line-height:1.7;color:#3f3f46;text-align:center;">رمز التحقق الخاص بك من 8 خانات</p>
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin:0 auto 24px;">
              <tr>
                <td dir="ltr" class="email-token" style="font-size:34px;letter-spacing:0.25em;font-weight:800;color:#18181b;background-color:#fafafa;border:1px solid #e4e4e7;border-radius:14px;padding:16px 18px;text-align:center;white-space:nowrap;">
                  {{ .Token }}
                </td>
                <td style="padding-right:4px;vertical-align:middle;">
                  <span role="button" tabindex="0" class="email-copy" title="نسخ الرمز" onmousedown="this.style.opacity='0.55';this.style.transform='scale(0.92)';" onmouseup="this.style.opacity='1';this.style.transform='scale(1)';" onmouseleave="this.style.opacity='1';this.style.transform='scale(1)';" ontouchstart="this.style.opacity='0.55';" ontouchend="this.style.opacity='1';" onclick="var b=this;function done(){b.style.color='#16a34a';setTimeout(function(){b.style.color='#52525b';},1600);}if(navigator.clipboard&amp;&amp;navigator.clipboard.writeText){navigator.clipboard.writeText('{{ .Token }}').then(done).catch(done);}else{done();}" style="display:inline-block;cursor:pointer;padding:10px 8px;color:#52525b;line-height:0;transition:opacity 0.12s ease,transform 0.12s ease,color 0.2s ease;"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></span>
                </td>
              </tr>
            </table>
            <p class="email-muted" style="margin:0 0 18px;font-size:13px;line-height:1.7;color:#71717a;text-align:center;">اكتب هذا الرمز في صفحة استعادة كلمة المرور داخل المنصة.</p>
            <p class="email-muted" style="margin:0 0 12px;font-size:13px;line-height:1.65;color:#71717a;">إذا لم تطلب ذلك، تجاهل هذه الرسالة.</p>
            <p class="email-muted" style="margin:0;font-size:12px;line-height:1.6;color:#71717a;">الرمز صالح لمرة واحدة ولمدة محدودة.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
